<div class="tabla-contenedor">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>Código</th>
      <td mat-cell *matCellDef="let libro"><strong>{{ libro.id }}</strong></td>
    </ng-container>
    <ng-container matColumnDef="titulo">
      <th mat-header-cell *matHeaderCellDef>Título</th>
      <td mat-cell *matCellDef="let libro">{{ libro.titulo }}</td>
    </ng-container>
    <ng-container matColumnDef="autor">
      <th mat-header-cell *matHeaderCellDef>Autor</th>
      <td mat-cell *matCellDef="let libro">{{ libro.autor }}</td>
    </ng-container>
    <ng-container matColumnDef="categoria">
      <th mat-header-cell *matHeaderCellDef>Categoría</th>
      <td mat-cell *matCellDef="let libro"><mat-chip>{{ libro.categoria }}</mat-chip></td>
    </ng-container>
    <ng-container matColumnDef="disponibles">
      <th mat-header-cell *matHeaderCellDef>Disponibles</th>
      <td mat-cell *matCellDef="let libro"><strong>{{ libro.disponibles }}</strong></td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let libro">
        <button mat-raised-button color="primary" [routerLink]="['/libro', libro.id]">Ver detalle</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
  </table>
  @if (dataSource.data.length === 0) {
    <p class="sin-resultados">No se encontraron libros en esta categoría.</p>
  }
</div>
